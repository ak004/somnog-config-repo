# One domain, two upstreams:
#
#   /api...  -> the NestJS gateway (Swagger lives at /api/docs)
#   anything else -> the Next.js frontend
#
# The /api prefix is deliberately NOT stripped. The gateway sets it itself with
# app.setGlobalPrefix('api'), so /api/events has to arrive as /api/events -
# rewriting it to /events here would 404 every route.

# Docker's embedded DNS. Containers get a new ip every time a deploy recreates
# them, and an `upstream` block would resolve once at startup and then serve
# 502s until nginx was reloaded by hand. Resolving per request through a
# variable is what keeps deploys hands-off.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Registration forms can carry uploads; nginx's 1m default is the usual
    # cause of a 413 that the app never sees.
    client_max_body_size 25m;

    # Where certbot's http-01 challenge is served from. Harmless before TLS
    # exists, and it has to be in place before the first certificate request.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api {
        set $gateway http://gateway:3000;
        proxy_pass $gateway$request_uri;
        include /etc/nginx/proxy-common.conf;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend$request_uri;
        include /etc/nginx/proxy-common.conf;
    }
}
